name: Rack Static Integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static references
        run: python scripts/validate_static.py
      - name: Validate canary JavaScript syntax
        run: node --check assets/js/account-config.js && node --check assets/js/account-canary.js
