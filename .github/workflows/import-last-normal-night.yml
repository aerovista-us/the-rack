name: Import The Last Normal Night

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - '.github/workflows/import-last-normal-night.yml'
      - 'scripts/import_last_normal_night.py'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    concurrency:
      group: import-last-normal-night
      cancel-in-progress: true
    steps:
      - name: Checkout The Rack
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image verifier
        run: python -m pip install --disable-pip-version-check pillow

      - name: Import canonical EchoStory issue
        run: python scripts/import_last_normal_night.py

      - name: Verify Rack publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          rack = json.loads((root / 'rack.json').read_text(encoding='utf-8'))
          books = [b for b in rack.get('books', []) if b.get('id') == 'last-normal-night-issue-1']
          assert len(books) == 1, f'expected one Rack book entry, found {len(books)}'
          book = books[0]
          assert book.get('status') == 'complete'
          assert book.get('format') == {'width': 2063, 'height': 3150}
          assert len(book.get('sequence', [])) == 27, len(book.get('sequence', []))
          assert book.get('publicationVersion'), 'dynamic cache key missing'
          assert book.get('shareUrl') == 'read/last-normal-night-issue-1/'

          route = root / 'read/last-normal-night-issue-1/index.html'
          assert route.exists(), route
          route_text = route.read_text(encoding='utf-8')
          assert '#/read/last-normal-night-issue-1/1' in route_text

          pages = root / 'content/EchoStory/the-last-normal-night/issue-1/pages'
          names = ['00-cover-front.png', '01-inside-front.png'] + [f'p{n:02d}.png' for n in range(1, 25)] + ['26-cover-back.png']
          for name in names:
              path = pages / name
              assert path.exists(), path
              with Image.open(path) as im:
                  assert im.size == (2063, 3150), (path, im.size)
                  im.verify()

          story = book['sequence'][2:26]
          assert all(item.get('focusRegions') for item in story), 'all 24 story pages must carry authored Panel Focus regions'
          versions = {item['src'].split('?v=', 1)[1] for item in book['sequence'] if item.get('type') == 'image' and '?v=' in item.get('src', '')}
          assert versions == {book['publicationVersion']}, (versions, book['publicationVersion'])
          print('RACK QA PASS: 27 publishing images, 24 authored focus maps, cache-safe URLs, direct read route')
          PY

      - name: Commit Rack publication
        run: |
          git config user.name 'AeroVista Rack Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rack.json content/EchoStory/the-last-normal-night/issue-1/pages read/last-normal-night-issue-1/index.html
          if git diff --cached --quiet; then
            echo 'Rack publication already current.'
          else
            git commit -m 'Publish The Last Normal Night Issue 1'
            git push
          fi
