<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17120d" />
  <title>Vespera Publication Engine — v0 Prototype</title>
  <link rel="stylesheet" href="reader.css" />
</head>
<body>
  <main class="reader-app" id="readerApp">
    <header class="reader-toolbar">
      <div class="reader-brand">
        <span class="reader-brand__mark">V</span>
        <div>
          <strong id="publicationTitle">Loading publication…</strong>
          <span id="publicationMeta">Vespera Publication Engine · v0</span>
        </div>
      </div>
      <div class="reader-actions">
        <button id="paperToggle" type="button" aria-pressed="true">Paper</button>
        <button id="fullscreenButton" type="button">Fullscreen</button>
      </div>
    </header>

    <section class="book-workspace" aria-label="Publication reader">
      <div class="book-shadow" aria-hidden="true"></div>
      <div class="page-stack page-stack--left" id="leftStack" aria-hidden="true"></div>
      <div class="page-stack page-stack--right" id="rightStack" aria-hidden="true"></div>
      <div class="book-stage" id="bookStage">
        <div id="book"></div>
      </div>
      <button class="edge-nav edge-nav--left" id="previousButton" type="button" aria-label="Previous page">‹</button>
      <button class="edge-nav edge-nav--right" id="nextButton" type="button" aria-label="Next page">›</button>
    </section>

    <footer class="reader-status">
      <div class="reader-progress" aria-hidden="true"><span id="progressBar"></span></div>
      <div class="reader-status__line">
        <span id="pageStatus">Preparing pages…</span>
        <span>Drag a corner · swipe · arrows</span>
      </div>
    </footer>
  </main>

  <div id="errorPanel" class="error-panel" hidden role="alert"></div>

  <script src="../vendor/page-flip.browser.min.js"></script>
  <script src="reader.js" defer></script>
</body>
</html>
